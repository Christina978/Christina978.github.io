<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Gleaners</title>
<style>
/* VOICE: unhurried, warm, a painting you can walk into
   IDEA: an oil canvas made only of 3D brush strokes
   PICTURE: the full-bleed WebGL canvas itself
   COLOUR and TYPE: ochre/straw/umber paper panels, Georgia
   LAYOUT: canvas fills the screen, small panels at the edges */
html,body{margin:0;height:100%;background:#2a2420;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font:13px/1.4 Georgia,"Times New Roman",serif;color:#2b2118}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.panel{position:fixed;background:rgba(236,222,190,.84);border:1px solid rgba(90,70,45,.35);border-radius:6px;box-shadow:0 2px 10px rgba(40,25,10,.25)}
#hud{top:8px;left:8px;padding:6px 9px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none}
#ui{top:8px;right:8px;padding:5px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:min(70vw,560px)}
#ui button,#ui select{font:inherit;font-size:13px;background:#f3e7c9;color:#2b2118;border:1px solid #8a7250;border-radius:4px;padding:4px 9px;min-height:32px;cursor:pointer}
#ui button.on{background:#c99a4a;color:#1d150d}
#ui button:focus-visible,#ui select:focus-visible{outline:2px solid #6b3f1c;outline-offset:1px}
#count{bottom:12px;left:50%;transform:translateX(-50%);padding:5px 14px;font-size:15px;white-space:nowrap}
#help{bottom:12px;right:8px;padding:8px 11px;max-width:300px;font-size:12px;display:none}
#help.show{display:block}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#efe0b6,#c9a965);z-index:10;transition:opacity .8s}
#load h1{font-weight:normal;font-size:clamp(30px,6vw,46px);letter-spacing:.03em;margin:0 0 4px}
#load p{margin:4px 0 14px;opacity:.75}
#bar{width:min(70vw,380px);height:6px;background:rgba(80,60,35,.25);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#6b4f2c;transition:width .2s}
#err{color:#7a1d10;max-width:80vw;text-align:center}
#touch{display:none}
.touch #touch{display:block}
.touch #help{display:none!important}
#joy{position:fixed;left:20px;bottom:64px;width:124px;height:124px;border-radius:50%;background:rgba(236,222,190,.32);border:2px solid rgba(90,70,45,.45);touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:42px;height:42px;border-radius:50%;background:rgba(110,80,45,.72)}
.tb{position:fixed;width:68px;height:68px;border-radius:50%;background:rgba(236,222,190,.6);border:2px solid rgba(90,70,45,.5);font:inherit;font-size:14px;color:#2b2118;touch-action:none}
#bJump{right:20px;bottom:86px}#bGather{right:98px;bottom:52px}
@media (max-width:600px){#hud{font-size:10px}#ui{top:72px;max-width:94vw}#ui button,#ui select{font-size:12px;padding:3px 7px;min-height:30px}#count{bottom:auto;top:auto;bottom:8px;font-size:14px}}
</style>
</head>

<canvas id="cv"></canvas>

<div id="hud" class="panel"></div>
<div id="ui" class="panel">
  <select id="tier" aria-label="Quality tier"><option>Ultra</option><option>High</option><option>Medium</option><option>Mobile</option></select>
  <button id="bAuto" class="on" title="Gleaner follows the track by herself">Auto</button>
  <button id="bTour" title="Camera tour (T)">Tour</button>
  <button id="bPhoto" title="Photo mode (P)">Photo</button>
  <button id="bSound" title="WebAudio synth">Sound off</button>
  <button id="bHelp">?</button>

 case 'building':{const d=mid*2.2;const xf=XF(o.x,y0,o.z,o.rot);const hs=[o.w/2,o.h/2,o.d/2];const b=sBox(hs,()=>[0,1,0],'xXzZ');

function genChunk(job,tier){const r=T.rng(T.h32(job.id*7919+T.SEED));const B=new Builder();

function genSky(job,tier){const r=T.rng(T.h32(job.id*131+T.SEED));const B=new Builder();const R=3000;const n=Math.round(tier.sky/8);

const LAYERS=[{R:1150,h:11,amp:7,w:4,lit:[0.42,0.43,0.31],shd:[0.25,0.26,0.25],tree:1},{R:1850,h:18,amp:40,w:9,lit:[0.55,0.57,0.62],shd:[0.42,0.45,0.53]},{R:2650,h:30,amp:110,w:15,lit:[0.66,0.68,0.75],shd:[0.55,0.58,0.67]}];

function genChar(job,tier){const def=T.CHARS[job.name];const r=T.rng(T.h32(job.name.length*7717+job.name.charCodeAt(0)*131+job.name.charCodeAt(job.name.length-1)+T.SEED));const B=new Builder();

 render();gl.finish();return {id,strokes:strokesDrawn,tier:tierName,physics:phys?phys.name:'-',w:cv.width,h:cv.height,cam:camPos.map(v=>+v.toFixed(2))};};
window.__exitShot=()=>{shotMode=false;};
window.__sim=function(sec,inp){inp=inp||{};shotMode=true;const dt=1/30;let maxHop=0;const c0=hero.count;if(inp.auto!==undefined){hero.auto=inp.auto;hero.lastInput=inp.auto?-1e9:simClock;}const hops=[];let air=false;
 for(let t=0;t<sec;t+=dt){keys.w=!!inp.w;keys.shift=!!inp.shift;if(inp.jumpAt&&inp.jumpAt.some(j=>Math.abs(j-t)<dt/2))hero.jumpQ=true;if(inp.gatherAt!==undefined&&Math.abs(inp.gatherAt-t)<dt/2)startGather();
  simT+=dt;simClock+=dt;updateHero(dt);updateCamera(dt);const h=hero.y-T.terrainH(hero.x,hero.z);maxHop=Math.max(maxHop,h);if(!hero.grounded&&!air){air=true;hops.push(+t.toFixed(2));}if(hero.grounded)air=false;}
 keys.w=false;keys.shift=false;return {x:+hero.x.toFixed(2),z:+hero.z.toFixed(2),s:+(hero.s-T.S0).toFixed(1),maxHop:+maxHop.toFixed(2),hops,gathered:hero.count-c0,auto:hero.auto,physics:phys.name,obstaclesAhead:T.SCENE.obst.filter(o=>o.s!==undefined).map(o=>+(o.s-T.S0).toFixed(0)).slice(0,4)};};
window.__info=()=>({tier:tierName,renderer,physics:window.__physics,rapierError:window.__rapierError||null,firstImageMs:window.__firstImageMs,genMs:window.__genMs,chunks:chunks.length,
 totalStrokes:chunks.reduce((s,c)=>s+c.count,0),charTypes:Object.keys(charSets).length,shaderLogs:window.__shaderLogs,errors:window.__errors,msaa:curSamples(),cbf:hasCBF,bench:window.__benchMs});

// ---------------------------------------------------------------- startup benchmark → tier
function benchmark(){const w=640,h=360;makeRTsmall();const proj=perspective(FOV,w/h,0.1,1000,0,0),view=viewRot([0,-0.15,-1]);
 gl.bindFramebuffer(gl.FRAMEBUFFER,BR.f);gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);const Rg=P_RING;const save=tier;tier=TIERS.High;setCommon(Rg,proj,view,w,h,[-30,1.3,20]);tier=save;
 gl.uniform1f(Rg.u.uRing,24);gl.uniform1f(Rg.u.uRingScale,1.2);gl.uniform1ui(Rg.u.uSeed,7);gl.bindVertexArray(emptyVAO);
 const N=300000;gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,20000);const px=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
 const t0=performance.now();for(let i=0;i<3;i++){gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N);}gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);const ms=(performance.now()-t0)/3;
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(BR.f);gl.deleteTexture(BR.t);gl.deleteRenderbuffer(BR.d);window.__benchMs=+ms.toFixed(2);return ms;}
let BR=null;function makeRTsmall(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,640,360,0,gl.RGBA,gl.UNSIGNED_BYTE,null);const d=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,d);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,640,360);
 const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,d);BR={t,d,f};}
function pickTier(){const q=QS.get('tier');if(q){const n=Object.keys(TIERS).find(k=>k.toLowerCase()===q.toLowerCase());if(n)return n;}
 const ms=benchmark();const soft=/swiftshader|llvmpipe|software|basic render/i.test(renderer);const small=Math.min(screen.width,screen.height)<700;
 if(soft)return 'Mobile';let t=ms<3?'Ultra':ms<8?'High':ms<20?'Medium':'Mobile';if(isTouch&&small)t='Mobile';return t;}
// ---------------------------------------------------------------- go
try{tierName=pickTier();tier=TIERS[tierName];$('tier').value=tierName;}catch(e){fail(String(e));}
resetHero(T.S0);setShotState();simT=0;simClock=0;hero.count=0;hero.bundle=0.45;for(const c of comps){c.count=0;c.bundle=0.5;c.gatherT=-1;}$('cnt').textContent='0';
initPhysics().then(()=>{phys.teleport(hero.x,hero.y,hero.z);});
startGeneration();updateCamera(0);requestAnimationFrame(loop);
addEventListener('error',e=>window.__errors.push(String(e.message)));
}
