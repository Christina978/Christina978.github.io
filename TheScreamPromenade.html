<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TheScreamPromenade</title>
<style>
/* VOICE: nervous, hushed, the UI whispers so the painting can scream
   IDEA: a tempera-on-cardboard painting you can walk inside
   PICTURE: the full-bleed WebGL2 canvas, nothing else competes
   COLOUR and TYPE: blue-black panels, bone text, vermilion accent; system sans only (no font assets)
   LAYOUT: canvas edge-to-edge, tiny HUD top-left, tool strip top-right, touch pads bottom */
:root{color-scheme:dark;--ink:#efe3c8;--panel:rgba(10,14,30,.72);--acc:#e2521f;--line:rgba(239,227,200,.18)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#a39684;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;left:10px;top:10px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none;max-width:calc(100vw - 20px)}
#tools{position:fixed;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:calc(100vw - 20px)}
#tools button,#tools select{font:600 13px system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:34px;padding:0 10px;cursor:pointer}
#tools button[aria-pressed=true]{border-color:var(--acc);color:#fff;background:rgba(150,40,18,.78)}
#tools button:focus-visible,#tools select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;transition:opacity 1.2s;pointer-events:none;text-align:center;max-width:calc(100vw - 24px)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#a39684;color:#1a1a2e;transition:opacity .6s}
#load .box{width:min(360px,80vw)}
#load h1{font:800 30px/1.05 system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em;color:#141a38}
#load p{margin:0 0 14px;color:#3a3040}
.bar{height:6px;background:rgba(20,26,56,.18);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d43a1a,#f2b632)}
#topbar{position:fixed;left:0;right:0;top:0;height:3px;pointer-events:none}
#topbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d43a1a,#f2b632);transition:width .2s}
#err{position:fixed;left:10px;bottom:10px;right:10px;max-height:40vh;overflow:auto;background:rgba(60,0,0,.85);color:#fff;font:12px ui-monospace,monospace;padding:8px;white-space:pre-wrap;display:none}
.touch{position:fixed;display:none;z-index:5}
body.is-touch .touch{display:block}
#joy{left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(10,14,30,.35);border:2px solid var(--line)}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(239,227,200,.35);border:2px solid rgba(239,227,200,.6)}
.tbtn{width:72px;height:72px;border-radius:50%;background:rgba(10,14,30,.5);border:2px solid var(--line);color:var(--ink);font:700 13px system-ui,sans-serif;display:grid!important;place-items:center}
body:not(.is-touch) .tbtn{display:none!important}
#bJump{right:22px;bottom:26px}
#bScream{right:104px;bottom:60px;border-color:rgba(226,82,31,.7)}
body.photo #hud,body.photo #tools,body.photo #help,body.photo .touch,body.photo .tbtn{display:none!important}
#photoTag{position:fixed;left:10px;bottom:10px;font:12px ui-monospace,monospace;color:#141a38;background:rgba(239,227,200,.7);padding:3px 7px;border-radius:4px;display:none}
body.photo #photoTag{display:block}
@media (max-width:600px){#tools button,#tools select{min-height:32px;padding:0 8px;font-size:12px}#hud{font-size:11px;top:54px}#help{bottom:auto;top:150px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="TheScreamPromenade: begehbares Gemälde"></canvas>
<div id="topbar"><i></i></div>
<div id="hud" aria-live="off"></div>
<div id="tools">
  <select id="tier" aria-label="Qualitätsstufe"><option>Ultra</option><option>High</option><option>Medium</option><option>Mobile</option></select>
  <button id="bTour" aria-pressed="false" title="Kamerafahrt (T)">Tour</button>
  <button id="bAuto" aria-pressed="true" title="Automatisch folgen (F)">Auto</button>
  <button id="bPhoto" aria-pressed="false" title="Fotomodus (P)">Foto</button>
  <button id="bSound" aria-pressed="false" title="Ton an/aus (M)">Ton</button>
  <button id="bHud" aria-pressed="true" title="HUD (H)">HUD</button>
</div>
<div id="help">WASD gehen · Shift rennen · Leertaste springen · Ziehen drehen · Rad zoomen · E schreien · T Tour · P Foto · H HUD</div>
<div id="joy" class="touch"><i></i></div>
<button id="bJump" class="touch tbtn" aria-label="Springen">Sprung</button>
<button id="bScream" class="touch tbtn" aria-label="Schreien">Schrei</button>
<div id="photoTag"></div>
<div id="load"><div class="box"><h1>TheScreamPromenade</h1><p id="loadMsg">Grundiere den Karton …</p><div class="bar"><i id="loadBar"></i></div></div></div>
<div id="err"></div>

<script>
{
'use strict';
/* =====================================================================
   Shared world description (runs on main thread and inside workers)
   ===================================================================== */
function worldLib(){
  const DECK_Y=2.0,DECK_HW=1.6,BZ0=0,BZ1=140,RAIL_X=1.6;
  const HOLES=[[24.6,25.8],[109.8,111.0]];
  const OBST=[{min:[-1.5,2.0,40.88],max:[0.95,2.15,41.06]},{min:[-1.45,2.0,88.0],max:[1.45,2.26,88.16]}];
  const BROKEN=[61,67];
  const sl=Math.hypot(0.55,0.13,0.83);
  const SUN=[0.55/sl,0.13/sl,0.83/sl];
  const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
  function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*0.25;}
  function H(x,z){
    const s=1.2-x;let h;
    if(s>0){const a=Math.max(s-3,0);h=1.4+s*0.12+a*0.45+a*a*0.0035;}else h=1.4+s*1.3;
    const w=sstep(0,10,s),sp=Math.max(s,0);
    h+=w*((0.6+0.05*sp)*Math.sin(z*0.045+s*0.07)+0.8*Math.sin(z*0.11-s*0.13));
    h=smin(h,70+8*Math.sin(z*0.013)+6*Math.sin(x*0.02),12);
    const dx=(x-95)/55,dz=(z-245)/75;
    h=Math.max(h,34*Math.exp(-(dx*dx+dz*dz))-6+3*Math.sin(x*0.08+z*0.05));
    h=Math.max(h,(x-240)*0.25+5*Math.sin(z*0.02));
    return h;
  }
  function phiT(x,y,z){return y*0.5+2.4*Math.sin(x*0.05+z*0.022)+1.4*Math.sin(z*0.061-x*0.035+1.3);}
  function inHole(z,m){m=m||0;for(const h of HOLES)if(z>h[0]-m&&z<h[1]+m)return true;return false;}
  return {DECK_Y,DECK_HW,BZ0,BZ1,RAIL_X,HOLES,OBST,BROKEN,SUN,H,phiT,inHole,sstep};
}

/* =====================================================================
   Stroke generator (Web Worker body)
   ===================================================================== */
function workerMain(){
  const W=self.W;
  const GEN=[{L:.10,W:.034,cov:3.2,op:1},{L:.075,W:.013,cov:1.5,op:.8},{L:.05,W:.009,cov:.35,op:.85},{L:.085,W:.008,cov:.22,op:.95}];
  const SKYG=[{L:.2,W:.05,cov:1.8},{L:.24,W:.012,cov:1.5},{L:.16,W:.008,cov:.4}];
  const F_SKY=1,F_WATER=2,F_FIG=4,F_SIL=8,F_DECK=16;
  const ST=19;let P=null,rng=null,A=new Float64Array(ST*4096),cap=4096,n=0;
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function push(x,y,z,nx,ny,nz,tx,ty,tz,L,Wd,mat,gen,flags,dref,curv,op,tint,dry){
    if(n>=cap){cap*=2;const B=new Float64Array(cap*ST);B.set(A);A=B;}
    const o=n*ST;A[o]=x;A[o+1]=y;A[o+2]=z;A[o+3]=nx;A[o+4]=ny;A[o+5]=nz;A[o+6]=tx;A[o+7]=ty;A[o+8]=tz;
    A[o+9]=L;A[o+10]=Wd;A[o+11]=mat;A[o+12]=gen;A[o+13]=flags;A[o+14]=dref;A[o+15]=curv;A[o+16]=op;A[o+17]=tint;A[o+18]=dry;n++;
  }
  const f32=new Float32Array(1),u32=new Uint32Array(f32.buffer);
  function toHalf(v){f32[0]=v;const x=u32[0];const s=(x>>>16)&0x8000;const e=((x>>>23)&0xff)-112;const m=x&0x7fffff;if(e<=0)return s;if(e>=31)return s|0x7bff;return s|(e<<10)|(m>>>13);}
  function oct(x,y,z){const l=Math.abs(x)+Math.abs(y)+Math.abs(z)||1;let u=x/l,v=y/l;if(z<0){const ou=u;u=(1-Math.abs(v))*(ou>=0?1:-1);v=(1-Math.abs(ou))*(v>=0?1:-1);}return [u,v];}
  const cl=(v,a,b)=>v<a?a:v>b?b:v;
  function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
  function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
  function pack(){
    if(n===0)return null;
    const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];let drefMax=0;
    for(let i=0;i<n;i++){const o=i*ST;for(let k=0;k<3;k++){const v=A[o+k];if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v;}if(A[o+14]>drefMax)drefMax=A[o+14];}
    const ext=[Math.max(mx[0]-mn[0],1e-3),Math.max(mx[1]-mn[1],1e-3),Math.max(mx[2]-mn[2],1e-3)];
    const seeds=new Uint16Array(n);for(let i=0;i<n;i++)seeds[i]=Math.floor(rng()*65536);
    const cnt=new Uint32Array(65537);for(let i=0;i<n;i++)cnt[seeds[i]+1]++;for(let i=1;i<65537;i++)cnt[i]+=cnt[i-1];
    const order=new Uint32Array(n);for(let i=0;i<n;i++)order[cnt[seeds[i]]++]=i;
    const buf=new ArrayBuffer(n*24),u16=new Uint16Array(buf),i8=new Int8Array(buf),u8=new Uint8Array(buf);
    for(let k=0;k<n;k++){
      const i=order[k],o=i*ST,b=k*24,h=k*12;
      u16[h]=Math.round((A[o]-mn[0])/ext[0]*65535);u16[h+1]=Math.round((A[o+1]-mn[1])/ext[1]*65535);u16[h+2]=Math.round((A[o+2]-mn[2])/ext[2]*65535);u16[h+3]=seeds[i];
      const on=oct(A[o+3],A[o+4],A[o+5]),ot=oct(A[o+6],A[o+7],A[o+8]);
      i8[b+8]=Math.round(on[0]*127);i8[b+9]=Math.round(on[1]*127);i8[b+10]=Math.round(ot[0]*127);i8[b+11]=Math.round(ot[1]*127);
      u16[h+6]=toHalf(A[o+9]);u16[h+7]=toHalf(A[o+10]);
      u8[b+16]=A[o+11];u8[b+17]=A[o+12];u8[b+18]=A[o+13];
      u8[b+19]=cl(Math.round(Math.log2(Math.max(A[o+14],0.25)/0.25)*20),0,255);
      u8[b+20]=cl(Math.round((cl(A[o+15],-2,2)+2)/4*255),0,255);
      u8[b+21]=cl(Math.round(A[o+16]*255),0,255);u8[b+22]=cl(Math.round(A[o+17]*255),0,255);u8[b+23]=cl(Math.round(A[o+18]*255),0,255);
    }
    return {data:buf,count:n,min:mn,ext:ext,drefMax:drefMax};
  }
  /* ---- generic emitters ---- */
  function sizeOf(g,sf){const G=GEN[g],s=sf/Math.sqrt(P.m);return [G.L*s*(0.7+0.6*rng()),G.W*s*(0.75+0.5*rng())];}
  function countFor(g,area,sf){const G=GEN[g];const L=G.L*sf/Math.sqrt(P.m),Wd=G.W*sf/Math.sqrt(P.m);return G.cov*area/(L*Wd);}
  // triangle a,b,c ; normal n ; preferred tangent t ; options
  function emitTri(a,b,c,nrm,tdir,mat,dref,sf,flags,maxL,maxW,gens){
    const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    const cr=cross(e1,e2);const area=0.5*Math.hypot(cr[0],cr[1],cr[2]);if(area<1e-6)return;
    let t=[tdir[0],tdir[1],tdir[2]];const d=dot(t,nrm);t=norm([t[0]-nrm[0]*d,t[1]-nrm[1]*d,t[2]-nrm[2]*d]);
    gens=gens||[0,1,2];
    for(const g of gens){
      let k=Math.floor(countFor(g,area,sf)+rng());if(g===0&&k<1&&area>0.002)k=1;
      for(let i=0;i<k;i++){
        let r1=rng(),r2=rng();if(r1+r2>1){r1=1-r1;r2=1-r2;}
        const p=[a[0]+e1[0]*r1+e2[0]*r2,a[1]+e1[1]*r1+e2[1]*r2,a[2]+e1[2]*r1+e2[2]*r2];
        let [L,Wd]=sizeOf(g,sf);if(maxL)L=Math.min(L,maxL);if(maxW)Wd=Math.min(Wd,maxW);
        const ang=(rng()-0.5)*0.12;const bb=cross(nrm,t);const tt=norm([t[0]+bb[0]*ang,t[1]+bb[1]*ang,t[2]+bb[2]*ang]);
        push(p[0]+nrm[0]*0.004,p[1]+nrm[1]*0.004,p[2]+nrm[2]*0.004,nrm[0],nrm[1],nrm[2],tt[0],tt[1],tt[2],L,Wd,mat,g,flags,dref,(rng()-0.5)*0.6,GEN[g].op*(0.75+0.25*rng()),0,rng());
      }
    }
  }
  function emitQuad(c,U,V,nrm,tdir,mat,dref,sf,flags,gens){
    const p00=[c[0]-U[0]-V[0],c[1]-U[1]-V[1],c[2]-U[2]-V[2]],p10=[c[0]+U[0]-V[0],c[1]+U[1]-V[1],c[2]+U[2]-V[2]];
    const p11=[c[0]+U[0]+V[0],c[1]+U[1]+V[1],c[2]+U[2]+V[2]],p01=[c[0]-U[0]+V[0],c[1]-U[1]+V[1],c[2]-U[2]+V[2]];
    const lu=Math.hypot(U[0],U[1],U[2])*2,lv=Math.hypot(V[0],V[1],V[2])*2;
    if(!tdir)tdir=lu>=lv?U:V;
    const mL=Math.max(lu,lv)*1.1,mW=Math.min(lu,lv)*1.15;
    emitTri(p00,p10,p11,nrm,tdir,mat,dref,sf,flags,mL,mW,gens);emitTri(p00,p11,p01,nrm,tdir,mat,dref,sf,flags,mL,mW,gens);
  }
  function emitEdge(p0,p1,navg,dref,sf,flags,mat){
    const d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]];const len=Math.hypot(d[0],d[1],d[2]);if(len<1e-4)return;
    const t=[d[0]/len,d[1]/len,d[2]/len];const [L0]=sizeOf(3,sf);
    const k=Math.max(1,Math.ceil(len/(L0*0.75)));
    for(let i=0;i<k;i++){
      const f=(i+0.5+(rng()-0.5)*0.4)/k;let [L,Wd]=sizeOf(3,sf);L=Math.min(L,len*1.05);
      push(p0[0]+d[0]*f,p0[1]+d[1]*f,p0[2]+d[2]*f,navg[0],navg[1],navg[2],t[0],t[1],t[2],L,Wd,mat==null?18:mat,3,flags,dref,(rng()-0.5)*0.5,0.9,0,rng()*0.5);
    }
  }
  // box with center c and half axes ax,ay,az (vectors)
  function emitBox(c,ax,ay,az,mat,dref,sf,flags,edges){
    const axes=[ax,ay,az];
    for(let i=0;i<3;i++){
      const ai=axes[i],aj=axes[(i+1)%3],ak=axes[(i+2)%3];const un=norm(ai);
      for(const s of [-1,1]){
        const fc=[c[0]+ai[0]*s,c[1]+ai[1]*s,c[2]+ai[2]*s];
        emitQuad(fc,aj,ak,[un[0]*s,un[1]*s,un[2]*s],null,mat,dref,sf,flags);
      }
    }
    if(edges===false)return;
    for(let k=0;k<3;k++){
      const ai=axes[(k+1)%3],aj=axes[(k+2)%3],ak=axes[k];const ui=norm(ai),uj=norm(aj);
      for(const si of [-1,1])for(const sj of [-1,1]){
        const b=[c[0]+ai[0]*si+aj[0]*sj,c[1]+ai[1]*si+aj[1]*sj,c[2]+ai[2]*si+aj[2]*sj];
        emitEdge([b[0]-ak[0],b[1]-ak[1],b[2]-ak[2]],[b[0]+ak[0],b[1]+ak[1],b[2]+ak[2]],norm([ui[0]*si+uj[0]*sj,ui[1]*si+uj[1]*sj,ui[2]*si+uj[2]*sj]),dref,sf,F_SIL);
      }
    }
  }
  /* ---- terrain ---- */
  function tNormal(x,z){const e=0.3;const hx=(W.H(x+e,z)-W.H(x-e,z))/(2*e),hz=(W.H(x,z+e)-W.H(x,z-e))/(2*e);return norm([-hx,1,-hz]);}
  function tFlow(x,y,z,nn){const e=0.4;const g=[(W.phiT(x+e,y,z)-W.phiT(x-e,y,z))/(2*e),(W.phiT(x,y+e,z)-W.phiT(x,y-e,z))/(2*e),(W.phiT(x,y,z+e)-W.phiT(x,y,z-e))/(2*e)];let t=cross(nn,g);if(Math.hypot(t[0],t[1],t[2])<1e-4)t=cross(nn,[0,0,1]);return norm(t);}
  function tFlowAt(x,z){const y=W.H(x,z);const nn=tNormal(x,z);return [tFlow(x,y,z,nn),nn];}
  function drefGround(x,z){const dz=z<0?-z:z>140?z-140:0;return Math.max(5,0.85*Math.hypot(x,dz));}
  function jobGround(j){
    const cs=4;
    for(let cz=j.z0;cz<j.z0+j.S;cz+=cs)for(let cx=j.x0;cx<j.x0+j.S;cx+=cs){
      const dr0=drefGround(cx+cs/2,cz+cs/2);const sf0=dr0*0.7;
      for(let g=0;g<4;g++){
        const k=Math.floor(countFor(g,cs*cs,sf0)+rng());
        for(let i=0;i<k;i++){
          const x=cx+rng()*cs,z=cz+rng()*cs;const h=W.H(x,z);const dref=drefGround(x,z),sf=dref*0.7;
          if(h<-0.03){
            if(g===3||rng()<0.34)continue;
            let [L,Wd]=sizeOf(g,sf);
            push(x,0,z,0,1,0,1,0,0,L*1.5,Wd,1,g,F_WATER,dref,0,GEN[g].op*(0.7+0.3*rng()),0,rng());
          }else{
            const nn=tNormal(x,z);const t=tFlow(x,h,z,nn);
            let [L,Wd]=sizeOf(g,sf);
            const del=L*0.4;const b=cross(nn,t);
            const [t1]=tFlowAt(x-t[0]*del,z-t[2]*del),[t2]=tFlowAt(x+t[0]*del,z+t[2]*del);
            const curv=cl(dot([t2[0]-t1[0],t2[1]-t1[1],t2[2]-t1[2]],b)/(2*del)*L,-2,2);
            let mat=h<0.9?3:2;if(x>25)mat=7;let flags=0;
            if(g===3){mat=18;flags=F_SIL;}
            push(x,h+0.01,z,nn[0],nn[1],nn[2],t[0],t[1],t[2],L,Wd,mat,g,flags,dref,curv,GEN[g].op*(0.75+0.25*rng()),0,rng());
          }
        }
      }
    }
  }
  /* ---- bridge deck ---- */
  function jobDeck(j){
    const dref=6,sf=2.6,area=3.2*(j.z1-j.z0);
    for(let g=0;g<3;g++){
      const k=Math.floor(countFor(g,area,sf)+rng());
      for(let i=0;i<k;i++){
        const x=-1.6+rng()*3.2,z=j.z0+rng()*(j.z1-j.z0);if(W.inHole(z))continue;

  const upd=e=>{const r=jz.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}joy.x=x;joy.y=y;knob.style.transform=`translate(${x*38}px,${y*38}px)`;};
  jz.addEventListener('pointerdown',e=>{jid=e.pointerId;jz.setPointerCapture(jid);joy.on=true;upd(e);Snd.unlock();e.preventDefault();});
  jz.addEventListener('pointermove',e=>{if(e.pointerId===jid)upd(e);});
  const end=e=>{if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;joy.on=false;knob.style.transform='';};
  jz.addEventListener('pointerup',end);jz.addEventListener('pointercancel',end);}
$('bJump').addEventListener('pointerdown',e=>{jumpReq=true;if(Char.auto&&!tour)setAuto(false);e.preventDefault();});
$('bScream').addEventListener('pointerdown',e=>{doScream();e.preventDefault();});
setTimeout(()=>{$('help').style.opacity='0';},9000);

/* ---------- optional synth (muted by default) ---------- */
const Snd={ctx:null,on:false,master:null,
  unlock(){},
  ensure(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const c=this.ctx=new AC();this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.connect(this.master);
    this.drone=c.createGain();this.drone.gain.value=0.05;this.drone.connect(lp);
    for(const f of [55,82.6,110.3]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=(Math.random()-0.5)*14;const g=c.createGain();g.gain.value=0.33;o.connect(g);g.connect(this.drone);o.start();}
    const tick=()=>{if(!this.ctx)return;const t=c.currentTime;this.drone.gain.setTargetAtTime(0.035+0.05*heart(simTime),t,0.03);setTimeout(tick,50);};tick();return true;},
  toggle(){if(!this.ensure())return;this.on=!this.on;this.ctx.resume();this.master.gain.setTargetAtTime(this.on?0.6:0,this.ctx.currentTime,0.1);$('bSound').setAttribute('aria-pressed',this.on);},
  scream(){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const len=1.8,b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=b;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=6;
    bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(1500,t+0.35);bp.frequency.exponentialRampToValueAtTime(380,t+len);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.08);g.gain.exponentialRampToValueAtTime(0.001,t+len);
    const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(760,t+0.3);o.frequency.exponentialRampToValueAtTime(190,t+len);
    const og=c.createGain();og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(0.12,t+0.1);og.gain.exponentialRampToValueAtTime(0.001,t+len);
    src.connect(bp);bp.connect(g);g.connect(this.master);o.connect(og);og.connect(bp);src.start(t);o.start(t);src.stop(t+len);o.stop(t+len);}};

/* ---------- headless verification hooks ---------- */
const SHOTS={
  wide:{eye:[-1.1,4.3,-9],look:[1.6,3.0,60],char:[0,2,9,0]},
  closeup:{eye:[0.35,2.95,15.3],look:[1.25,2.1,16.6],char:[0,2,30,0]},
  protagonist:{eye:[0.55,3.45,15.45],look:[0,3.35,18],char:[0,2,18,Math.PI]},
  sky:{eye:[0,3.2,4],look:[14,48,100],char:[0,2,9,0]},
  tour:{tourT:21.5,char:[0,2,30,0]},
  mobile:{eye:[-0.8,4.4,-6.5],look:[1.4,3.0,60],char:[0,2,10,0]}};
window.__shot=async(id,opt={})=>{
  await window.__ready;const s=SHOTS[id];if(!s)throw new Error('unknown shot '+id);
  simTime=opt.time!=null?opt.time:12;Char.p={x:s.char[0],y:s.char[1],z:s.char[2]};Char.yaw=s.char[3];Char.gait=0;Char.speed=0;Char.scream=opt.scream?simTime-(opt.scream):-99;Char.screamO=[Char.p.x,Char.p.z];
  NPC[0].z=70;NPC[1].z=72.6;
  let eye=s.eye,look=s.look;if(s.tourT!=null){const tp=tourAt(s.tourT);eye=tp.eye;look=tp.look;}
  shot={eye,look,yawDeg:opt.yaw||0,accum:opt.accum||0};lastVP=null;
  const frames=(opt.accum||0)+3;for(let i=0;i<frames;i++)await new Promise(r=>requestAnimationFrame(()=>r()));
  gl.finish();
  return {drawn:drawnStrokes,total:totalStrokes,tier:tierName,phys:Phys.kind,w:RT.w,h:RT.h};
};
window.__release=()=>{shot=null;};
window.__stats=()=>({fps,tier:tierName,total:totalStrokes,drawn:drawnStrokes,phys:Phys.kind,physState,physInitMs,benchMs,renderer:rendererName,samples:RT&&RT.samples,genMs:genEnd?genEnd-genStart:null,firstFrameMs:firstFrameAt?firstFrameAt-genStart:null,glError:gl.getError(),jobs:[jobsDone,jobsTotal],chunks:chunks.length,char:{...Char.p,grounded:Char.grounded,auto:Char.auto}});
window.__setChar=(o)=>{Object.assign(Char,o);};
window.__simulate=(sec,step=1/60)=>{const log=[];let minY=9,jumps=0,wasG=true;for(let t=0;t<sec;t+=step){simTime+=step;updateChar(step);if(wasG&&!Char.grounded&&Char.v.y>0)jumps++;wasG=Char.grounded;minY=Math.min(minY,Char.p.y);}
  return {p:{...Char.p},dir:Char.dir,grounded:Char.grounded,minY,jumps,phys:Phys.kind};};

/* ---------- go ---------- */
initRapier();
startGeneration();
requestAnimationFrame(frame);
}
