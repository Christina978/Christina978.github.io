<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StarryNightRide</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1430;color:#f3e6b5;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 62% 34%,#2c5292,#0b1430 70%);z-index:10;transition:opacity .9s}
#load h1{font-weight:normal;letter-spacing:.08em;font-size:clamp(28px,6vw,54px);margin:0 0 18px;color:#f6d36b;text-shadow:0 0 18px #f6b73c88}
#bar{width:min(360px,70vw);height:6px;background:#ffffff22;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d36b,#e9893a);transition:width .2s}
#lmsg{margin-top:12px;font-size:14px;opacity:.8}
#hud{position:fixed;left:12px;top:10px;font-size:13px;line-height:1.45;text-shadow:0 1px 3px #000d;pointer-events:none;max-width:62vw}
#hud b{color:#f6d36b;font-weight:normal;font-size:17px;letter-spacing:.05em}
#stats{opacity:.78;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
#btns{position:fixed;right:12px;top:10px;display:flex;gap:8px}
button{font:inherit;font-size:13px;color:#f3e6b5;background:#13254dcc;border:1px solid #f6d36b77;border-radius:18px;padding:7px 13px;cursor:pointer;touch-action:manipulation}
button.on{background:#f6d36b;color:#13254d}
#joy{position:fixed;left:24px;bottom:24px;width:132px;height:132px;border-radius:50%;background:#ffffff12;border:2px solid #f6d36b55;display:none;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#f6d36bb0;pointer-events:none}
#jump{position:fixed;right:26px;bottom:36px;width:86px;height:86px;border-radius:50%;display:none;font-size:15px}
body.touch #joy,body.touch #jump{display:block}
body.touch #help{display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#0b1430;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><h1>StarryNightRide</h1><div id="bar"><i></i></div><div id="lmsg">Pinsel werden vorbereitet…</div></div>
<div id="hud"><b>StarryNightRide</b><br><span id="mode"></span><br><span id="help">WASD reiten · Shift Galopp · Leertaste springen · Maus ziehen = Blick · Rad = Zoom · T = Kameraflug</span><div id="stats"></div></div>
<div id="btns"><button id="bAuto" class="on">Auto-Pfad</button><button id="bTour">Kameraflug</button></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">Sprung</button>
<div id="err"></div>
<script type="module">
// =====================================================================
//  StarryNightRide — everything on screen is an instanced oil-paint stroke
// =====================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
if (!gl) { const e=document.getElementById('err'); e.style.display='flex'; e.textContent='WebGL2 wird von diesem Browser nicht unterstützt.'; throw new Error('no webgl2'); }
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints>0);
if (isTouch) document.body.classList.add('touch');
const Q  = isTouch ? 0.34 : 1.0;          // stroke-count multiplier (mobile: fewer strokes)
const QS = Math.min(1.75, 1/Math.sqrt(Q)); // stroke-size compensation
const DPR = Math.min(window.devicePixelRatio||1, 3);

// ---------------------------------------------------------------- utils
const PI=Math.PI, TAU=PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let _s=20250419;
function R(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const RR=(a,b)=>a+(b-a)*R();
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), nrm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l];};
const UP=[0,1,0];
function rotAround(v,k,a){const c=Math.cos(a),s=Math.sin(a),kv=cross(k,v),d=dot(k,v)*(1-c);return[v[0]*c+kv[0]*s+k[0]*d,v[1]*c+kv[1]*s+k[1]*d,v[2]*c+kv[2]*s+k[2]*d];}
const angLerp=(a,b,t)=>{let d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+d*t;};
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  mul(a,b,o=new Float32Array(16)){for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;},
  persp(fy,as,n,f){const t=1/Math.tan(fy/2),m=new Float32Array(16);m[0]=t/as;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  look(e,c,u){const z=nrm(sub(e,c)),x=nrm(cross(u,z)),y=cross(z,x);const m=new Float32Array(16);
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-dot(x,e);m[13]=-dot(y,e);m[14]=-dot(z,e);m[15]=1;return m;},
  T(x,y,z){const m=M4.id();m[12]=x;m[13]=y;m[14]=z;return m;},
  RX(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},
  RY(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;},
  RZ(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;},
};
const xf=(m,p)=>[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];

// ---------------------------------------------------------------- world layout
const WL=-0.4;                                   // water level
const riverX=z=>118+12*Math.sin(z*0.017+0.5)+5*Math.sin(z*0.045);
const riverDX=z=>12*0.017*Math.cos(z*0.017+0.5)+5*0.045*Math.cos(z*0.045);
const cliffZ=x=>-192+5*Math.sin(x*0.04)+2.5*Math.sin(x*0.11+1);
let WX=riverX(-192),WZ=cliffZ(WX); for(let i=0;i<3;i++){WX=riverX(WZ+3);WZ=cliffZ(WX);}   // waterfall
const PZ=178, PX=riverX(160)+4, PR=28;              // pond
const BZ=20, BX=riverX(20);                         // bridge
const deckY=lx=>{const a=Math.abs(lx);return a<16?0.55+1.3*(1-(lx/16)**2):0.55-(a-16)*0.35;};
const SF={x:-60,z:60,r:46,pr:30.5};                 // sunflower field + circular path
const WHEAT=[[-5,70,45,140,0.3],[150,250,95,200,-0.5],[-235,-165,30,150,1.2]];
const VIL={x0:160,x1:245,z0:-65,z1:95};
const WM={x:-188,z:-62}, COT={x:-158,z:-92};
const CHURCH={x:215,z:-18};
const flatZones=[[205,15,75,0.85],[-175,-78,38,0.85],[-60,60,52,0.75],[BX,BZ,40,0.4]];

function heightRaw(x,z){
  let h=2.2*Math.sin(x*0.021+1.3)*Math.sin(z*0.017+0.4)+1.1*Math.sin(x*0.043+z*0.031+0.7)+0.4*Math.sin(x*0.11-z*0.083)+0.22*Math.sin(x*0.19+z*0.23);
  for(const f of flatZones){const d=Math.hypot(x-f[0],z-f[1]);if(d<f[2]){h=mix(h,0.8,(1-sstep(f[2]*0.55,f[2],d))*f[3]);}}
  const r=Math.hypot(x,z),a=Math.atan2(z,x);
  h+=sstep(290,720,r)*(22+14*Math.sin(a*3+0.5)+7*Math.sin(a*7+1.1)+3*Math.sin(a*13));
  const zc=cliffZ(x);
  const pl=sstep(zc+1.5,zc-5.5,z);
  h+=pl*(22+1.4*Math.sin(x*0.3)*Math.sin(z*0.37))+ (pl>0.05&&pl<0.95?1.6*Math.sin(x*0.9)*Math.sin(z*1.3):0);
  if(z>zc-2&&z<PZ+5){const dr=Math.abs(x-riverX(z));if(dr<34){const wz=sstep(zc-2,zc+4,z)*(1-sstep(PZ-5,PZ+5,z));
      h=mix(h,0.5,(1-sstep(7,30,dr))*wz);h=mix(h,WL-6,(1-sstep(5.5,8,dr))*wz);}}
  const dp=Math.hypot(x-PX,z-PZ);
  if(dp<PR+24){h=mix(h,0.5,1-sstep(PR,PR+22,dp));h=mix(h,WL-6,1-sstep(PR-2.5,PR+0.5,dp));}
  if(z<zc-2&&z>zc-90){const dr=Math.abs(x-WX-(z-WZ)*0.15);if(dr<8)h=mix(h,22+WL-3.5,(1-sstep(3,5.5,dr))*sstep(zc-2,zc-6,z));}
  return h;
}
function isWaterRaw(x,z){
  if(z>WZ+1.5&&z<PZ&&Math.abs(x-riverX(z))<7.4)return true;
  if(Math.hypot(x-PX,z-PZ)<PR-0.6)return true;
  if(z<WZ-3&&z>WZ-88&&Math.abs(x-WX-(z-WZ)*0.15)<3.4)return true;
  return false;
}
const waterY=(x,z)=> z<WZ-1 ? 22+WL : WL;

// --- route (closed Catmull-Rom loop)
const ROUTE_PTS=[[-20,-10],[40,12],[BX-30,BZ],[BX+30,BZ],[175,22],[215,55],[212,120],[185,175],[150,228],[80,226],[30,180],[-25,135],[-75,118],[-125,85],[-150,25],[-155,-35],[-120,-62],[-65,-45]];
function buildRoute(){
  const P=ROUTE_PTS,n=P.length,d=[];
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<60;k++){const t=k/60,t2=t*t,t3=t2*t;
      const f=j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);d.push([f(0),f(1)]);}}
  const S=[];let acc=0,prev=d[0],next=0;
  for(let i=1;i<=d.length;i++){const c=d[i%d.length],sl=Math.hypot(c[0]-prev[0],c[1]-prev[1]);
    while(next<=acc+sl){const t=(next-acc)/sl;S.push({x:mix(prev[0],c[0],t),z:mix(prev[1],c[1],t)});next+=1;}acc+=sl;prev=c;}
  for(let i=0;i<S.length;i++){const a=S[(i-1+S.length)%S.length],b=S[(i+1)%S.length];const l=Math.hypot(b.x-a.x,b.z-a.z)||1;S[i].tx=(b.x-a.x)/l;S[i].tz=(b.z-a.z)/l;}
  return S;
}
const ROUTE=buildRoute();
function distToRoute(x,z){let m=1e9;for(let i=0;i<ROUTE.length;i+=2){const s=ROUTE[i];const d=(s.x-x)**2+(s.z-z)**2;if(d<m)m=d;}return Math.sqrt(m);}

// --- ground-type grid (also uploaded as data texture for real-time grass)
const GN=768, G0=-400, GCPM=GN/800;     // cells per meter
const gH=new Float32Array(GN*GN), gT=new Uint8Array(GN*GN), gA=new Float32Array(GN*GN);
const gIdx=(x,z)=>{const i=clamp(Math.floor((x-G0)*GCPM),0,GN-1),j=clamp(Math.floor((z-G0)*GCPM),0,GN-1);return j*GN+i;};
const typeAt=(x,z)=>(x<G0||z<G0||x>-G0||z>-G0)?0:gT[gIdx(x,z)];
// 0 meadow 1 road 2 wheat 3 sunflower 4 water 5 village 6 rock
function buildGrid(){
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){const x=G0+(i+0.5)/GCPM,z=G0+(j+0.5)/GCPM;gH[j*GN+i]=heightRaw(x,z);}
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){
    const k=j*GN+i,x=G0+(i+0.5)/GCPM,z=G0+(j+0.5)/GCPM;
    const hx=(gH[j*GN+Math.min(i+1,GN-1)]-gH[j*GN+Math.max(i-1,0)])*GCPM/2,hz=(gH[Math.min(j+1,GN-1)*GN+i]-gH[Math.max(j-1,0)*GN+i])*GCPM/2;
    const sl=Math.hypot(hx,hz);let t=0;
    if(isWaterRaw(x,z))t=4;else if(sl>0.85)t=6;
    else{const ds=Math.hypot(x-SF.x,z-SF.z);
      if(ds<SF.r)t=3;
      else if(x>VIL.x0&&x<VIL.x1&&z>VIL.z0&&z<VIL.z1)t=5;
      else for(const w of WHEAT)if(x>w[0]&&x<w[1]&&z>w[2]&&z<w[3])t=2;}
    gT[k]=t;gA[k]=Math.atan2(hz,hx);
  }
  const stamp=(x,z,tx,tz,r)=>{const a=Math.atan2(tz,tx);const i0=Math.floor((x-r-G0)*GCPM),i1=Math.ceil((x+r-G0)*GCPM),j0=Math.floor((z-r-G0)*GCPM),j1=Math.ceil((z+r-G0)*GCPM);
    for(let j=Math.max(0,j0);j<=Math.min(GN-1,j1);j++)for(let i=Math.max(0,i0);i<=Math.min(GN-1,i1);i++){const cx=G0+(i+0.5)/GCPM,cz=G0+(j+0.5)/GCPM;
      if((cx-x)**2+(cz-z)**2<r*r){const k=j*GN+i;if(gT[k]!==4){gT[k]=1;gA[k]=a;}}}};
  for(const s of ROUTE)stamp(s.x,s.z,s.tx,s.tz,2.5);
  for(let a=0;a<TAU;a+=0.02)stamp(SF.x+Math.cos(a)*SF.pr,SF.z+Math.sin(a)*SF.pr,-Math.sin(a),Math.cos(a),1.5);
  const line=(x0,z0,x1,z1,r)=>{const L=Math.hypot(x1-x0,z1-z0),tx=(x1-x0)/L,tz=(z1-z0)/L;for(let s=0;s<=L;s+=0.8)stamp(x0+tx*s,z0+tz*s,tx,tz,r);};
  line(SF.x,SF.z+SF.pr,SF.x-8,SF.z+58,1.5);
  line(195,-58,195,95,2.2); line(CHURCH.x-16,CHURCH.z,195,CHURCH.z,1.8);
  line(COT.x+2,COT.z+5,-138,-56,1.5); line(WM.x+4,WM.z+5,-150,-38,1.4);
}

// ---------------------------------------------------------------- stroke buffers
class SBuf{
  constructor(c){this.n=0;this.cap=0;this.ab=null;this.grow(c);}
  grow(c){const ab=new ArrayBuffer(c*36);if(this.ab)new Uint8Array(ab).set(new Uint8Array(this.ab,0,this.n*36));this.ab=ab;this.f=new Float32Array(ab);this.i8=new Int8Array(ab);this.u8=new Uint8Array(ab);this.cap=c;}
  push(px,py,pz,nx,ny,nz,tx,ty,tz,L,W,lr,lg,lb,sr,sg,sb,kind,bone,seed){
    if(this.n>=this.cap)this.grow(this.cap*2);
    const o=this.n*9,b=this.n*36,f=this.f,i8=this.i8,u8=this.u8;
    f[o]=px;f[o+1]=py;f[o+2]=pz;
    i8[b+12]=Math.round(nx*127);i8[b+13]=Math.round(ny*127);i8[b+14]=Math.round(nz*127);i8[b+15]=0;
    i8[b+16]=Math.round(tx*127);i8[b+17]=Math.round(ty*127);i8[b+18]=Math.round(tz*127);i8[b+19]=bone;
    f[o+5]=L;f[o+6]=W;
    u8[b+28]=clamp(lr*255,0,255);u8[b+29]=clamp(lg*255,0,255);u8[b+30]=clamp(lb*255,0,255);u8[b+31]=(seed*255)|0;
    u8[b+32]=clamp(sr*255,0,255);u8[b+33]=clamp(sg*255,0,255);u8[b+34]=clamp(sb*255,0,255);u8[b+35]=kind;
    this.n++;
  }
}
// kinds: 0 solid · 1 sky-flow · 2 water · 3 foliage sway · 4 windmill sail · 5 sunflower · 6 celestial
//        7 lamp-lit emissive · 8 mountain · 9 waterfall flow · 10 reflection · 11 terrain · 13 far terrain
class Mesh{constructor(){this.v=[];this.i=[];this.nv=0;}
  vert(p,n,c,b=0){this.v.push(p[0],p[1],p[2],n[0],n[1],n[2],c[0],c[1],c[2],b);return this.nv++;}}
const SB=new SBuf(1<<20), SK=new SBuf(1<<14);
const UPM=new Mesh(), UPK=new Mesh(), UPSKY=new Mesh();
let CUR=SB, BONE=0, CURM=UPM;

function stroke(px,py,pz,nx,ny,nz,tx,ty,tz,L,W,lit,shd,kind=0,cj=0.07){
  let l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  let d=tx*nx+ty*ny+tz*nz;tx-=nx*d;ty-=ny*d;tz-=nz*d;l=Math.hypot(tx,ty,tz);
  if(l<1e-4){if(Math.abs(ny)<0.9){tx=0;ty=1;tz=0;}else{tx=1;ty=0;tz=0;}d=tx*nx+ty*ny+tz*nz;tx-=nx*d;ty-=ny*d;tz-=nz*d;l=Math.hypot(tx,ty,tz);}
  tx/=l;ty/=l;tz/=l;
  const v=1+(R()-0.5)*2*cj,a=1+(R()-0.5)*cj,b=1+(R()-0.5)*cj,c=1+(R()-0.5)*cj;
  CUR.push(px,py,pz,nx,ny,nz,tx,ty,tz,L,W,lit[0]*v*a,lit[1]*v*b,lit[2]*v*c,shd[0]*v*a,shd[1]*v*b,shd[2]*v*c,kind,BONE,R());
}
const pick=p=>p[(R()*p.length)|0];
// fill a parallelogram o + a*U + b*V with strokes
function fillQuad(o,U,V,dens,op){
  const C=cross(U,V),area=len(C),N=mul(C,1/area);
  const n=Math.max(1,Math.round(area*dens*(op.q??Q)));
  const Un=nrm(U),Vn=nrm(V);
  for(let k=0;k<n;k++){
    const a=R(),b=R();if(op.reject&&op.reject(a,b))continue;
    const off=op.off||0;
    const p=[o[0]+U[0]*a+V[0]*b+N[0]*off,o[1]+U[1]*a+V[1]*b+N[1]*off,o[2]+U[2]*a+V[2]*b+N[2]*off];
    let t=op.dir==='U'?Un:op.dir==='V'?Vn:op.dir==='UV'?(R()<0.5?Un:Vn):Array.isArray(op.dir)?op.dir:[R()-.5,R()-.5,R()-.5];
    t=sub(t,mul(N,dot(t,N)));t=rotAround(nrm(t),N,(R()-0.5)*(op.ang||0));
    const tl=op.tilt||0,pal=op.pal?pick(op.pal):[op.lit,op.shd],s=0.75+R()*0.5,qs=op.qs??QS;
    stroke(p[0],p[1],p[2],N[0]+(R()-.5)*tl,N[1]+(R()-.5)*tl,N[2]+(R()-.5)*tl,t[0],t[1],t[2],op.L*qs*s,op.W*qs*s,pal[0],pal[1],op.kind||0);
  }
}
function upQuad(o,U,V,col){const N=nrm(cross(U,V)),M=CURM;const a=M.vert(o,N,col,BONE),b=M.vert(add(o,U),N,col,BONE),c=M.vert(add(add(o,U),V),N,col,BONE),d=M.vert(add(o,V),N,col,BONE);M.i.push(a,b,c,a,c,d);}
function upTri(p0,p1,p2,col){const N=nrm(cross(sub(p1,p0),sub(p2,p0))),M=CURM;const a=M.vert(p0,N,col,BONE),b=M.vert(p1,N,col,BONE),c=M.vert(p2,N,col,BONE);M.i.push(a,b,c);}
function fillTri(p0,p1,p2,dens,op){fillQuad(p0,sub(p1,p0),sub(p2,p0),dens,{...op,reject:(a,b)=>a+b>1});}
// ellipsoid
function fillEllip(c,r,dens,op){
  const p=1.6,area=4*PI*Math.pow((Math.pow(r[0]*r[1],p)+Math.pow(r[0]*r[2],p)+Math.pow(r[1]*r[2],p))/3,1/p);

function genTerrain(){

    else if(type===3)ang=R()*TAU;

    const t=[Math.cos(ang),0,Math.sin(ang)];

  const ox=S.x,oz=S.z;S.x=r.p[0];S.y=r.p[1];S.z=r.p[2];
  if(r.grounded&&S.vy<0){S.vy=-1;S.grounded=true;}else S.grounded=r.grounded&&S.vy<=0;
  const hs=Math.hypot(S.x-ox,S.z-oz)/Math.max(dt,1e-4);S.aspeed=mix(S.aspeed,Math.min(hs,15),1-Math.exp(-dt*6));
  S.phase=(S.phase+dt*(0.9+S.aspeed*0.17))%1;
  S.air=mix(S.air,S.grounded?0:1,1-Math.exp(-dt*10));
  const fx=Math.sin(S.heading),fz=Math.cos(S.heading);const sl=(groundAt(S.x+fx*1.2,S.z+fz*1.2)-groundAt(S.x-fx*1.2,S.z-fz*1.2))/2.4;
  S.pitch=mix(S.pitch,-Math.atan(sl)*0.8,1-Math.exp(-dt*5));
  S.mode=manual?'Manuell':auto?'Auto-Pfad':'Steht';
  // camera
  camDist=mix(camDist,camDistT,1-Math.exp(-dt*6));
  if(time-lastDrag>2.5&&S.aspeed>1)camYaw=angLerp(camYaw,S.heading,1-Math.exp(-dt*1.1));
  const tgt=[S.x,S.y+2.4,S.z];camTgt=camTgt[1]===0?tgt:camTgt.map((v,i)=>mix(v,tgt[i],1-Math.exp(-dt*8)));
  const fw=[Math.sin(camYaw)*Math.cos(camPitch),-Math.sin(camPitch),Math.cos(camYaw)*Math.cos(camPitch)];
  camEye=sub(camTgt,mul(fw,camDist));const gy=groundAt(camEye[0],camEye[2])+0.7;if(camEye[1]<gy)camEye[1]=gy;
  if(tour){tourT+=dt/110;[camEye,camTgt]=tourCam(tourT%1);}
}

// ================================================================ RENDER
let resScale=1,fpsAvg=60,lodBias=1,frameTimes=[],lastAdj=0;
const GRASS_N=isTouch?190:300,GRASS_S=isTouch?0.48:0.33;
let UPV,UPKV,SKYV,EMPTYVAO;
function setCommon(P,VP,eye,pxs){const u=P.u;gl.useProgram(P.p);
  gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniform3fv(u.uCam,eye);gl.uniform1f(u.uTime,time);gl.uniform2f(u.uRes,canvas.width,canvas.height);
  if(u.uMinPx)gl.uniform1f(u.uMinPx,2.6*pxs);if(u.uMaxPx)gl.uniform1f(u.uMaxPx,46*pxs);if(u.uLodBias)gl.uniform1f(u.uLodBias,lodBias);if(u.uFar)gl.uniform1f(u.uFar,1150);
  gl.uniform3fv(u.uMoonDir,MOON);if(u.uWarm)gl.uniform1f(u.uWarm,P===PROG.up||P===PROG.upK?0.12:1);
  const lp=new Float32Array(48),lc=new Float32Array(36);const L=[[...lanternPos(),14,1.25,0.72,0.34],...LAMPS].slice(0,12);
  L.forEach((l,i)=>{lp.set([l[0],l[1],l[2],l[3]],i*4);lc.set([l[4],l[5],l[6]],i*3);});
  if(u.uLampP){gl.uniform4fv(u.uLampP,lp);gl.uniform3fv(u.uLampC,lc);gl.uniform1i(u.uLampN,L.length);}
  if(u.uTerr){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,TERRTEX);gl.uniform1i(u.uTerr,0);gl.uniform4f(u.uTerrXf,G0,G0,GCPM,GN);}
  if(u.uHub){gl.uniform3fv(u.uHub,WMHUB);gl.uniform3fv(u.uHubAx,WMAX);gl.uniform1f(u.uSail,time*0.55);}
  if(u.uBones)gl.uniformMatrix4fv(u.uBones,false,boneMats);
}
const lanternPos=()=>xf(BW[15],[0,-0.85,0]);
function frustum(m){const pl=[];const r=i=>[m[i],m[4+i],m[8+i],m[12+i]];const r0=r(0),r1=r(1),r2=r(2),r3=r(3);
  for(const[a,s]of[[r0,1],[r0,-1],[r1,1],[r1,-1],[r2,1],[r2,-1]])pl.push([r3[0]+s*a[0],r3[1]+s*a[1],r3[2]+s*a[2],r3[3]+s*a[3]]);return pl;}
function boxVisible(pl,b){for(const p of pl){const x=p[0]>0?b[3]:b[0],y=p[1]>0?b[4]:b[1],z=p[2]>0?b[5]:b[2];if(p[0]*x+p[1]*y+p[2]*z+p[3]<0)return false;}return true;}
let drawnStrokes=0;
function render(){
  const cw=canvas.clientWidth||innerWidth,ch=canvas.clientHeight||innerHeight;
  const pxs=DPR*resScale,W=Math.max(1,Math.round(cw*pxs)),H=Math.max(1,Math.round(ch*pxs));
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
  gl.viewport(0,0,W,H);gl.clearColor(0.05,0.08,0.2,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);
  const eye=camOverride?camOverride[0]:camEye,tg=camOverride?camOverride[1]:camTgt;
  const fov=(H>W?66:54)*PI/180;const proj=M4.persp(fov,W/H,0.25,9000),view=M4.look(eye,tg,UP),VP=M4.mul(proj,view);
  poseRider(S);
  // sky underpaint
  let P=PROG.up;setCommon(P,VP,eye,pxs);gl.depthMask(false);gl.uniform1i(P.u.uCamRel,1);gl.uniform1f(P.u.uPush,0);gl.bindVertexArray(SKYV.vao);gl.drawElements(gl.TRIANGLES,SKYV.count,gl.UNSIGNED_INT,0);gl.depthMask(true);
  // underpaint (solid silhouettes / ground canvas)
  gl.uniform1i(P.u.uCamRel,0);gl.uniform1f(P.u.uPush,1);gl.bindVertexArray(UPV.vao);gl.drawElements(gl.TRIANGLES,UPV.count,gl.UNSIGNED_INT,0);
  P=PROG.upK;setCommon(P,VP,eye,pxs);gl.uniform1i(P.u.uCamRel,0);gl.uniform1f(P.u.uPush,0.4);gl.bindVertexArray(UPKV.vao);gl.drawElements(gl.TRIANGLES,UPKV.count,gl.UNSIGNED_INT,0);
  // strokes
  P=PROG.stroke;setCommon(P,VP,eye,pxs);
  const pl=frustum(VP);drawnStrokes=0;
  const vis=[];for(const c of CHUNKS){if(!c.always){if(!boxVisible(pl,c.bb))continue;const dx=Math.max(c.bb[0]-eye[0],0,eye[0]-c.bb[3]),dz=Math.max(c.bb[2]-eye[2],0,eye[2]-c.bb[5]);c.d=Math.hypot(dx,dz);if(c.d>1150)continue;}else c.d=1e6;vis.push(c);}
  vis.sort((a,b)=>a.d-b.d);
  for(const c of vis){gl.bindVertexArray(c.vao);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,c.count);drawnStrokes+=c.count;}
  P=PROG.skin;setCommon(P,VP,eye,pxs);gl.bindVertexArray(VAOS.skin.vao);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,VAOS.skin.count);drawnStrokes+=VAOS.skin.count;
  P=PROG.grass;setCommon(P,VP,eye,pxs);gl.uniform1i(P.u.uGN,GRASS_N);gl.uniform1f(P.u.uGS,GRASS_S);gl.uniform1f(P.u.uGFar,GRASS_N*GRASS_S*0.5*0.95);
  gl.bindVertexArray(EMPTYVAO);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,GRASS_N*GRASS_N);drawnStrokes+=GRASS_N*GRASS_N;
  gl.bindVertexArray(null);
}
// adaptive resolution
function adapt(dt){frameTimes.push(dt);if(frameTimes.length>40)frameTimes.shift();const avg=frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;fpsAvg=1/avg;
  if(time-lastAdj<1.2||frameTimes.length<30)return;
  if(avg>1/38){lastAdj=time;if(resScale>0.42)resScale=Math.max(0.4,resScale*0.85);else lodBias=Math.max(0.55,lodBias*0.9);frameTimes.length=0;}
  else if(avg<1/57&&(resScale<1||lodBias<1)){lastAdj=time+2;if(lodBias<1)lodBias=Math.min(1,lodBias*1.08);else resScale=Math.min(1,resScale*1.08);frameTimes.length=0;}}

// ================================================================ BOOT
const bar=document.querySelector('#bar i'),lmsg=document.getElementById('lmsg');
const step=async(p,m)=>{bar.style.width=(p*100)+'%';lmsg.textContent=m;await new Promise(r=>setTimeout(r,0));};
let running=true,lastT=0;
async function boot(){
  const rapierP=loadRapier();
  await step(0.03,'Leinwand grundieren…');buildGrid();
  await step(0.10,'Himmel mit Wirbeln malen…');genSky();
  await step(0.20,'Drei Bergketten…');genMountains();
  await step(0.30,'Felder und Wege…');genTerrain();genTerrainUnderpaint();
  await step(0.52,'Fluss, Wasserfall, Brücke…');water();bridge();
  await step(0.60,'Windmühle und Hütte…');windmill();cottage();
  await step(0.66,'Dorf und Kirchturm…');village();
  await step(0.72,'Zypressen und Bäume…');vegetation();
  await step(0.80,'Sonnenblumen…');sunflowers();
  await step(0.88,'Zäune, Mauern, Baumstämme…');obstacles();
  await step(0.91,'Reiter und Pferd…');buildRider();
  await step(0.94,'Pinselstriche zur GPU…');
  PROG.stroke=program(VS_STROKE,FS_STROKE);PROG.skin=program(VS_STROKE,FS_STROKE,'#define SKIN\n');PROG.grass=program(VS_GRASS,FS_STROKE);
  PROG.up=program(VS_UP,FS_UP);PROG.upK=program(VS_UP,FS_UP,'#define SKIN\n');
  uploadTerrainTex();uploadStrokes();UPV=meshVAO(UPM);UPKV=meshVAO(UPK);SKYV=meshVAO(UPSKY);EMPTYVAO=gl.createVertexArray();
  await step(0.97,'Physik laden (Rapier)…');
  const RA=await rapierP;let ok=false;
  if(RA){try{phys=new RapierPhys(RA);ok=true;}catch(e){console.warn('Rapier-Init fehlgeschlagen',e);}}
  if(!ok)phys=new SimplePhys();
  const s0=ROUTE[0];S.x=s0.x;S.z=s0.z;S.y=groundAt(s0.x,s0.z)+0.05;S.heading=Math.atan2(s0.tx,s0.tz);camYaw=S.heading;phys.spawn([S.x,S.y,S.z]);
  window.SNR.ready=true;
  document.getElementById('load').style.opacity=0;setTimeout(()=>document.getElementById('load').remove(),1000);
  requestAnimationFrame(loop);
}
const statsEl=document.getElementById('stats'),modeEl=document.getElementById('mode');let statT=0;
function loop(t){
  if(!running){requestAnimationFrame(loop);return;}
  const dt=lastT?Math.min(0.05,(t-lastT)/1000):1/60;lastT=t;
  simulate(dt);render();adapt(dt);
  statT+=dt;if(statT>0.4){statT=0;modeEl.textContent=(tour?'Kameraflug · ':'')+S.mode+(S.grounded?'':' · Sprung');
    statsEl.textContent=`${fpsAvg.toFixed(0)} fps · Auflösung ${(resScale*100).toFixed(0)}% (${canvas.width}×${canvas.height})\nStriche: ${(STATIC_N/1e6).toFixed(2)} Mio statisch + ${(GRASS_N*GRASS_N/1e3).toFixed(0)}k Gras + ${(SK.n/1e3).toFixed(1)}k Reiter\nPhysik: ${phys.name}`;}
  requestAnimationFrame(loop);
}
window.SNR={ready:false,
  pause(v=true){running=!v;},
  step(n=1,dt=1/60){for(let i=0;i<n;i++)simulate(dt);},
  render(){render();},
  setCam(e,t){camOverride=e?[e,t]:null;},
  tour(v=true){tour=v;tourT=0;},
  tourAt(t){tour=true;tourT=t;simulate(1/60);},
  info(){return{static:STATIC_N,skin:SK.n,grass:GRASS_N*GRASS_N,drawn:drawnStrokes,physics:phys&&phys.name,pos:[S.x,S.y,S.z],grounded:S.grounded,mode:S.mode,routeI:S.routeI,res:[canvas.width,canvas.height],resScale,lodBias,fps:fpsAvg,obst:OBST.length,lamps:LAMPS.length,Q};},
  state:S,obst:OBST,route:ROUTE,
  teleport(x,z,h){S.x=x;S.z=z;S.y=groundAt(x,z);if(h!==undefined)S.heading=h;if(phys.body)phys.body.setTranslation({x,y:S.y+1.06,z},true);phys.p=[x,S.y,z];},
};
boot().catch(e=>{console.error(e);const el=document.getElementById('err');el.style.display='flex';el.textContent='Fehler: '+e.message;});
</script>
